name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static analysis & code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The lowest version composer.json supports: php-cs-fixer and rector
          # must judge the code against the language level users actually get.
          php-version: '8.3'
          extensions: mbstring, curl, zip, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

  test:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json requires ^8.3: both supported versions must stay green.
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, zip, json
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the unit suite
        run: vendor/bin/phpunit --testsuite unit

      # The integration suite talks to the real Amilon sandbox. It only runs
      # when the credentials are configured as repository secrets; otherwise the
      # tests skip themselves and this step is a no-op. The "opt-in" group —
      # tests that place real sandbox orders or need an extra fixture such as a
      # known order id — is excluded here; run those deliberately with the
      # matching env var and --group opt-in.
      - name: Run the integration suite against the Amilon sandbox
        if: ${{ env.AMILON_CLIENT_ID != '' }}
        env:
          AMILON_BASE_URI: ${{ secrets.AMILON_BASE_URI }}
          AMILON_CLIENT_ID: ${{ secrets.AMILON_CLIENT_ID }}
          AMILON_CLIENT_SECRET: ${{ secrets.AMILON_CLIENT_SECRET }}
        run: vendor/bin/phpunit --testsuite integration --fail-on-skipped --exclude-group opt-in

      - name: Coverage report
        run: vendor/bin/phpunit --testsuite unit --coverage-text
